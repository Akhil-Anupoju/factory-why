      <path d="M180,20 L220,10 L220,-10 L180,-20 A160 160 0 0 0 180,20" />
    </g>
    <g transform="scale(0.9)" fill="none" stroke="#0ea5a4" stroke-opacity="0.06" stroke-width="6">
      <circle cx="0" cy="0" r="140" />
      <circle cx="0" cy="0" r="80" />
    </g>
    <g fill="#082033" opacity="0.1">
      <rect x="-14" y="-120" width="28" height="40" rx="4" transform="rotate(20)" />
      <rect x="-14" y="80" width="28" height="40" rx="4" transform="rotate(-20)" />
