<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="a" x1="0" x2="1">
      <stop offset="0%" stop-color="#0ea5a4" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.06" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="none" />

  <!-- ambient large gear motif centered -->
