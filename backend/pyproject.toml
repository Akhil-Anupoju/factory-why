[project]
name = "factory-why-backend"
version = "0.1.0"
description = "Phase 1 backend slice for Factory WHY - FastAPI + deterministic simulator"
requires-python = ">=3.12,<4.0"

dependencies = [
    "fastapi>=0.99.0",
    "pydantic>=2.3",
    "uvicorn[standard]>=0.23.0",
    "google-adk>=1.22.0",
    # Google Cloud client libraries required for production adapters
    "google-cloud-firestore>=2.9.0,<3.0.0",
    "google-cloud-bigquery>=3.6.0,<4.0.0",
    "google-cloud-storage>=2.7.0,<3.0.0",
    # Pin firebase-admin to a 6.x release that depends on google-cloud-storage 1.x/2.x
    # to preserve the project's google-cloud-storage <3.0.0 constraint.
    "firebase-admin==6.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.24"]

[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
