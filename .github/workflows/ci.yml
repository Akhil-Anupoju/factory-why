name: CI

on:
  push: {}
  pull_request: {}

jobs:
  backend:
    name: Backend tests and build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: [3.12]
        node: [18.x]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r <(python - <<'PY'
import tomllib,sys
print('\n'.join(['-r requirements.txt']) )
PY)

      - name: Install backend runtime deps (minimal)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi>=0.99" "pydantic>=2.3" "uvicorn[standard]"

      - name: Run backend tests
        working-directory: backend
        run: |
          python -m pytest -q tests

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Install frontend deps
        run: |
          npm ci

      - name: Lint
        run: |
          npm run lint

      - name: Build
        run: |
          npm run build
